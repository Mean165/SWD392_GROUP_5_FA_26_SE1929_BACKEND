spring.application.name=aiviva

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/aiviva_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Server
server.port=8080

# Security (placeholder)
spring.security.user.name=admin
spring.security.user.password=admin123

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.timeout=${OPENAI_TIMEOUT:30000}