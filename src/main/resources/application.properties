spring.config.import=optional:file:./.env[.properties]
spring.application.name=aiviva

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aiviva_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Init
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.config.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Server
server.port=8080

# Email notifications
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Security (placeholder)
spring.security.user.name=${SPRING_SECURITY_USER_NAME:}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:}

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.timeout=${OPENAI_TIMEOUT:30000}

# Speech engines are local by default. Mock providers are test/dev only.
speech.tts.provider=${TTS_PROVIDER:local}
speech.tts.default-language=${SYSTEM_DEFAULT_TTS_LANGUAGE:${INTERVIEW_LANGUAGE:vi}}
speech.tts.cache-max-entries=${TTS_CACHE_MAX_ENTRIES:512}
speech.tts.local.engine=${LOCAL_TTS_ENGINE:korva}
speech.tts.local.voice-vi=${LOCAL_TTS_VOICE_VI:khanh_vy}
speech.tts.local.voice-en=${LOCAL_TTS_VOICE_EN:en_US-lessac-medium}
speech.tts.local.speed=${LOCAL_TTS_SPEED:1.0}
speech.tts.local.cache-directory=${LOCAL_TTS_CACHE_DIR:/models/tts-cache}
speech.tts.local.max-text-length=${LOCAL_TTS_MAX_TEXT_LENGTH:4000}

# Student audio is sent only to the local inference service.
speech.stt.provider=${STT_PROVIDER:local}
speech.stt.allowed-origins=${STT_ALLOWED_ORIGINS:}
speech.stt.session.max-duration-seconds=${STT_MAX_SESSION_DURATION_SECONDS:60}
speech.stt.session.max-frame-bytes=${STT_MAX_FRAME_BYTES:24000}
speech.stt.session.finish-timeout-seconds=${STT_FINISH_TIMEOUT_SECONDS:10}
speech.stt.device-check.sessions-per-minute=${DEVICE_CHECK_STT_SESSIONS_PER_MINUTE:5}
speech.stt.mock.scenario=${STT_MOCK_SCENARIO:normal}
speech.stt.mock.scenario-file=${STT_MOCK_SCENARIO_FILE:}
speech.stt.pipeline.mode=${STT_MODE:streaming_only}
speech.stt.pipeline.reconcile-threshold=${STT_RECONCILE_THRESHOLD:0.95}
speech.stt.pipeline.minimum-confidence=${STT_MIN_CONFIDENCE:0.55}
speech.stt.pipeline.glossary-fix-minimum-score=${GLOSSARY_FIX_MIN_SCORE:0.92}
speech.stt.pipeline.pause-minimum-ms=${PAUSE_MIN_MS:700}
speech.stt.pipeline.max-audio-seconds=${SESSION_STT_MAX_SECONDS:180}
speech.stt.pipeline.final-timeout-seconds=${STT_FINAL_TIMEOUT_SECONDS:30}
speech.stt.pipeline.max-repeat-per-turn=${MAX_REPEAT_PER_TURN:2}
speech.stt.pipeline.initial-prompt-max-tokens=${LOCAL_STT_PROMPT_MAX_TOKENS:160}
local.inference.url=${LOCAL_INFERENCE_URL:http://127.0.0.1:8000}
local.inference.token=${LOCAL_INFERENCE_TOKEN:}
local.inference.connect-timeout-ms=${LOCAL_CONNECT_TIMEOUT_MS:2000}
local.inference.request-timeout-seconds=${LOCAL_REQUEST_TIMEOUT_S:180}
local.inference.breaker-failure-threshold=${STT_BREAKER_FAILURE_THRESHOLD:5}
local.inference.breaker-open-seconds=${STT_BREAKER_OPEN_SECONDS:15}

# Interview limits and configured local EXAM audio retention.
interview.language=${INTERVIEW_LANGUAGE:vi}
system.language.default-stt=${SYSTEM_DEFAULT_STT_LANGUAGE:${INTERVIEW_LANGUAGE:vi}}
system.language.default-tts=${SYSTEM_DEFAULT_TTS_LANGUAGE:${INTERVIEW_LANGUAGE:vi}}
interview.answer-time-limit-seconds=${INTERVIEW_ANSWER_TIME_LIMIT_SECONDS:180}
interview.max-audio-bytes=${INTERVIEW_MAX_AUDIO_BYTES:10485760}
interview.max-transcript-characters=${INTERVIEW_MAX_TRANSCRIPT_CHARACTERS:20000}
interview.audio-storage-directory=${INTERVIEW_AUDIO_STORAGE_DIRECTORY:./uploads/audio}
interview.audio-retention-days=${AUDIO_RETENTION_DAYS:30}

# Student microphone and speaker device check
device-check.max-audio-bytes=${DEVICE_CHECK_MAX_AUDIO_BYTES:2097152}
device-check.max-duration-seconds=${DEVICE_CHECK_MAX_DURATION_SECONDS:15}
device-check.rate-limit.requests-per-minute=${DEVICE_CHECK_REQUESTS_PER_MINUTE:10}
device-check.accepted-mime-types=${DEVICE_CHECK_ACCEPTED_MIME_TYPES:audio/webm,audio/ogg,audio/wav,audio/x-wav,audio/mpeg,audio/mp4,audio/m4a}
device-check.languages=${DEVICE_CHECK_LANGUAGES:vi,en}
device-check.default-language=${DEVICE_CHECK_DEFAULT_LANGUAGE:vi}
device-check.recommended-recording-seconds=${DEVICE_CHECK_RECOMMENDED_RECORDING_SECONDS:5}
device-check.sample.vi=${DEVICE_CHECK_SAMPLE_VI:Tôi sẵn sàng bắt đầu bài thi vấn đáp}
device-check.sample.en=${DEVICE_CHECK_SAMPLE_EN:I am ready to start the oral exam}
device-check.tts-sample.vi=${DEVICE_CHECK_TTS_SAMPLE_VI:Xin chào, đây là kiểm tra âm thanh. Nếu bạn nghe rõ giọng nói này, loa của bạn hoạt động tốt.}
device-check.tts-sample.en=${DEVICE_CHECK_TTS_SAMPLE_EN:Hello, this is an audio check. If you can hear this voice clearly, your speakers are working.}

# Keep the request limit at Spring Boot's existing default; cap each audio file at 2 MiB.
spring.servlet.multipart.max-file-size=${QUESTION_DOCUMENT_MAX_BYTES:20971520}B
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

# Question generation provider. Keep GEMINI_API_KEY server-side only.
question.ai.provider=${QUESTION_AI_PROVIDER:${LLM_PROVIDER:mock}}
question.ai.api-key=${GEMINI_API_KEY:}
question.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
question.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
question.ai.timeout-seconds=${LLM_TIMEOUT_SECONDS:45}
question.files.storage-directory=${QUESTION_STORAGE_DIRECTORY:./uploads/question-documents}
question.files.max-bytes=${QUESTION_DOCUMENT_MAX_BYTES:20971520}
question.files.allowed-mime-types=${QUESTION_DOCUMENT_MIME_TYPES:application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
question.files.chunk-size=${QUESTION_CHUNK_SIZE:1200}
question.files.chunk-overlap=${QUESTION_CHUNK_OVERLAP:150}
question.generation.requests-per-hour=${QUESTION_GENERATION_REQUESTS_PER_HOUR:5}
question.rubric.total-points=${QUESTION_RUBRIC_TOTAL_POINTS:10}

# Grading AI is opt-in and separate from interview question-generation providers.
grading.ai.provider=${GRADING_AI_PROVIDER:disabled}
grading.ai.model=${GRADING_AI_MODEL:local-model}
grading.ai.base-url=${GRADING_AI_BASE_URL:http://127.0.0.1:11434/v1}
grading.ai.api-key=${GRADING_AI_API_KEY:}
grading.ai.timeout-seconds=${GRADING_AI_TIMEOUT_SECONDS:90}
grading.ai.samples=${AI_K_SAMPLES:3}
grading.ai.allow-remote=${GRADING_ALLOW_REMOTE_LLM:false}
grading.ai.include-signals=${INCLUDE_SIGNALS_IN_GRADING:false}
grading.ai.max-manual-runs=${AI_RERUN_MAX_PER_SUBMISSION:3}
grading.ai.worker-delay-ms=${AI_GRADING_WORKER_DELAY_MS:3000}
spring.task.scheduling.pool.size=${AI_GRADING_SCHEDULER_THREADS:2}
grading.reconcile-delay-ms=${GRADING_RECONCILE_DELAY_MS:30000}
grading.reconcile-initial-delay-ms=${GRADING_RECONCILE_INITIAL_DELAY_MS:10000}

exam.scheduler.enabled=${EXAM_SCHEDULER_ENABLED:true}
exam.scheduler.delay-ms=${EXAM_SCHEDULER_DELAY_MS:60000}
exam.dev.shift-enabled=${EXAM_DEV_SHIFT_ENABLED:false}
app.seed.demo-schedule=${APP_SEED_DEMO_SCHEDULE:false}
exam.default-max-overlap-percent=${EXAM_DEFAULT_MAX_OVERLAP_PERCENT:40}
