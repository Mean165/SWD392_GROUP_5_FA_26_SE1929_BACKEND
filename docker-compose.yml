version: "3.8"

services:
  # --- DỊCH VỤ 1: DATABASE (PostgreSQL) ---
  postgresdb:
    image: postgres:16-alpine
    container_name: movie-theater-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: movie_theater
    ports:
      - "5433:5432"  # Map port 5432 chuẩn của Postgres ra port 5433 máy thật để tránh trùng cổng cục bộ
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Tự động chạy file tạo bảng và chèn data khi container khởi động lần đầu
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql

  # --- DỊCH VỤ 2: BACKEND (Spring Boot) ---
  backend:
    build: .
    container_name: movie-theater-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - postgresdb  # Chờ database khởi động xong mới chạy backend
    environment:
      # Ghi đè cấu hình application.yml để kết nối vào container postgresdb
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/movie_theater
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      MOMO_ENDPOINT: ${MOMO_ENDPOINT}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_REQUEST_TYPE: ${MOMO_REQUEST_TYPE}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL}
      MOMO_IPN_URL: ${MOMO_IPN_URL}
      MOMO_TIMEOUT: ${MOMO_TIMEOUT}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_PROTOCOL: ${MAIL_PROTOCOL:-smtp}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      VNPAY_TMN_CODE: C7Q70M5U
      VNPAY_HASH_SECRET: FGJDDBIWXVIPIYBZXUIYMYITDMYATAVA
      VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      VNPAY_RETURN_URL: http://localhost:8080/api/payment/vnpay/return
      VNPAY_IPN_URL: http://localhost:8080/api/payment/vnpay/ipn

volumes:
  pg_data:
